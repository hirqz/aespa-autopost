name: Auto post X ke Telegram

on:
  # Jadwal otomatis dimatikan sementara selama uji coba.
  # Hapus tanda # di dua baris berikut untuk menyalakannya lagi.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        type: choice
        default: viewer_test
        options: [viewer_test, run, test, diagnose, reset]
      user:
        description: "Akun untuk viewer_test"
        type: string
        default: aespa_official

permissions:
  contents: write   # untuk menyimpan state.json kembali ke repo

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev   # secrets & variables diambil dari environment "dev"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install browser (khusus viewer_test)
        if: github.event.inputs.mode == 'viewer_test'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Jalankan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ACCOUNTS: ${{ vars.ACCOUNTS }}   # kalau kosong, pakai daftar di config.py
          TOPIC_ID: ${{ vars.TOPIC_ID }}
          TEST_USER: ${{ github.event.inputs.user }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "viewer_test" ]; then
            python viewer_test.py
          else
            python x_to_telegram.py "${{ github.event.inputs.mode || 'run' }}"
          fi

      - name: Simpan state
        if: always() && github.event.inputs.mode != 'viewer_test'
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
